name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint with ruff
        run: ruff check app/ tests/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          DINO_SUPPRESS_START_BANNER: "1"
          # Gia tri gia, chi de config_env._require_env() khong sys.exit(1).
          # Khong test nao goi Telegram hay partner API that.
          TELEGRAM_TOKEN: "000000:ci-dummy-telegram-token"
          API_SECRET_KEY: "ci-dummy-api-secret-key"
          SENDER_APP_PASSWORD: "ci-dummy-app-password"
          ADMIN_WEB_SESSION_SECRET: "ci-dummy-session-secret"
        run: |
          pytest tests/ -v --tb=short --cov=app/models --cov=app/state --cov=app/services/business_logic --cov-report=term-missing

  typecheck:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mypy
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Type check models
        run: mypy app/models/ --ignore-missing-imports
