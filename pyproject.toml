[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "botmmo"
version = "2.0.0"
description = "Dino Store - Telegram Bot for digital product sales"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B905",   # zip strict
    "SIM108", # ternary instead of if-else
    "UP042",  # enum.StrEnum is 3.11+; this repo is still developed on 3.10
]

# The files listed in app/core/section_manifest.py are exec'd into one shared,
# accumulating namespace by app/core/runtime_loader.py instead of being imported.
# Three of the rules below therefore report the mechanism rather than a mistake:
#
#   F821  names like logger, Update and products arrive from earlier sections
#   F401  boot_dependencies.py imports on behalf of the other 57 sections, so
#         every import there looks unused; deleting them breaks the whole bot
#   E402  sections run top-level code before their few local imports
#
# The rest is style debt in files the codebase is migrating away from (roughly
# 280 findings, mostly `if x: return` on one line and try/except/pass). New
# normal modules belong in app/web, app/models or app/services, which stay fully
# linted; anything dropped into the globbed directories below will not be.
[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["F821", "F401", "E402", "E401", "E701", "E702", "I001", "SIM102", "SIM103", "SIM105", "SIM114", "SIM115", "B007", "B025", "B904", "F841", "UP009", "W291", "W293"]
"app/database/*.py" = ["F821", "F401", "E402", "E401", "E701", "E702", "I001", "SIM102", "SIM103", "SIM105", "SIM114", "SIM115", "B007", "B025", "B904", "F841", "UP009", "W291", "W293"]
