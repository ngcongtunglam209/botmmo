services:
  bot:
    build: .
    container_name: dino-bot
    restart: unless-stopped
    env_file:
      - .env
      - .env.admin
    volumes:
      # Persist SQLite database and allow one-time admin credential migration.
      - ./database.sqlite:/app/database.sqlite
      - ./bot.log:/app/bot.log
      - ./.env.admin:/app/.env.admin
    # Expose API server port
    ports:
      - "${API_SERVER_PORT:-8080}:${API_SERVER_PORT:-8080}"
