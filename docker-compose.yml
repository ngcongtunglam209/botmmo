services:
  caddy:
    image: caddy:2
    container_name: dino-caddy
    restart: unless-stopped
    environment:
      # Caddyfile doc bien nay de tro dung port ma bot bind. Khong truyen vao day
      # thi Caddy roi ve mac dinh 8080 va doi API_SERVER_PORT se lam sap site.
      API_SERVER_PORT: ${API_SERVER_PORT:-8080}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./caddy_data:/data
      - ./caddy_config:/config
      # Cloudflare Origin Certificate (xem SETUP_BOT.md muc Reverse Proxy).
      - ./cloudflare-origin.pem:/etc/caddy/cloudflare-origin.pem:ro
      - ./cloudflare-origin-key.pem:/etc/caddy/cloudflare-origin-key.pem:ro
    depends_on:
      - bot

  bot:
    build: .
    container_name: dino-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Phai tro vao thu muc duoc mount ben duoi, xem chu thich o volumes.
      DB_PATH: /app/data/database.sqlite
      LOG_FILE: /app/logs/bot.log
    volumes:
      # Mount ca thu muc chu khong phai rieng file .sqlite: SQLite chay WAL nen
      # con ghi database.sqlite-wal va -shm ben canh. Neu chi mount file thi hai
      # file kia nam trong lop ephemeral cua container va WAL chua checkpoint se
      # mat khi `docker compose down`. Mount file don cung de vo khi file tren
      # host chua ton tai: Docker se tao mot *thu muc* trung ten.
      - ./data:/app/data
      - ./logs:/app/logs
    # Chi Caddy goi duoc port nay qua Docker network noi bo - khong public truc tiep ra VPS.
    expose:
      - "${API_SERVER_PORT:-8080}"
