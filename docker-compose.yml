services:
  caddy:
    image: caddy:2
    container_name: dino-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./caddy_data:/data
      - ./caddy_config:/config
      # Cloudflare Origin Certificate (xem SETUP_BOT.md muc Reverse Proxy).
      - ./cloudflare-origin.pem:/etc/caddy/cloudflare-origin.pem:ro
      - ./cloudflare-origin-key.pem:/etc/caddy/cloudflare-origin-key.pem:ro
    depends_on:
      - bot

  bot:
    build: .
    container_name: dino-bot
    restart: unless-stopped
    env_file:
      - .env
      - .env.admin
    volumes:
      # Persist SQLite database and allow one-time admin credential migration.
      - ./database.sqlite:/app/database.sqlite
      - ./bot.log:/app/bot.log
      - ./.env.admin:/app/.env.admin
    # Chi Caddy goi duoc port nay qua Docker network noi bo - khong public truc tiep ra VPS.
    expose:
      - "${API_SERVER_PORT:-8080}"
